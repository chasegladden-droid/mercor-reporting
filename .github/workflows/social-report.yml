name: Daily Social Report

on:
  schedule:
    - cron: '0 16 * * 1-5'  # 9am PDT (UTC-7) weekdays
  workflow_dispatch:         # allow manual runs

jobs:
  run-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      # Fail before publishing, not after. Every assertion in here is a bug that
      # once shipped silently — a dropped keyword, a post counted twice, a quote
      # in the wrong bucket. No network or secrets needed.
      - name: Check the counting rules
        run: python test_apex_social.py

      - name: Run social report
        env:
          SPROUT_API_TOKEN: ${{ secrets.SPROUT_API_TOKEN }}
          SPROUT_CUSTOMER_ID: ${{ secrets.SPROUT_CUSTOMER_ID }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLAY_API_KEY: ${{ secrets.CLAY_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python slack_report.py

      - name: Commit updated baseline
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add monthly_baseline.json tweet_cache.json
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore: update monthly baseline"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\":red_circle: *Daily Social Report failed*\nRun: https://github.com/chasegladden-droid/mercor-reporting/actions/runs/${{ github.run_id }}\"}"
